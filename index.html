<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="navbar">
        <div class="menu-box">
            <span></span>
            <span></span>
            <span></span>

        </div>

        <div class="git-img">
            <img src="git img.png" alt="">
        </div>
        <div>
            <Span class="nav-das">Dashboard</Span>
        </div>

        <div class="button-top">
            <button>
                <i class="fa-sharp fa-thin fa-magnifying-glass"></i>
                <span>Type to \search</span>
            </button>
        </div>

        <div class="Copilot-bar">
            <div class="Copilot-img">
                <img src="Copilot-img.png" alt="">
            </div>

            <select class="form-select" aria-label="Default select example">


                <option value="in-taxt">Assitive</option>
                <option value="in-taxt">Spaces</option>
                <option value="in-taxt">Download for</option>
                <option value="in-taxt">Setting</option>


            </select>
        </div>


        <div class="inside-div">
            <div class="puls-img">
                <img src="plus.png" alt="">
            </div>
            <select class="form-select1" aria-label="Default select example">

                <option value="in-text">New issue</option>
                <option value="in-text">New repository</option>
                <option value="in-text">improt repository</option>
                <option value="in-text">New codespace</option>
                <option value="in-text">New gist</option>
                <option value="in-text">New organization</option>
                <option value="in-text">New project</option>


            </select>
        </div>

        <div class="dot-cricle">
            <img src="dot.gif" alt="">
        </div>

        <div class="pull-img">
            <img src="pull img.png" alt="">
        </div>

        <div class="repost-img">
            <img src="Repositories-img.png" alt="">

        </div>
        <div class="unread-massage">
            <img src="unread-massage.png" alt="">
        </div>
        <div class="Default">
            <img src="default-img.png" alt="">
        </div>
    </div>
    <div class="in-div">

        <div class="main-div">

            <div class="inside-downside">
                <h2 class="h2">Top repositories</h2>

                <div class="new-repo">
                    <button>
                        <img src="Repositories-img.png" alt="New">
                        New
                    </button>
                </div>

            </div>
            <div class="input-div div2">
                <input class="search-input input--block input-color " type="text" placeholder="Find a repository…">
            </div>

        </div>
        <div>

            <div class="home">
                <h2>Home</h2>
            </div>
            <div class="chat-box">
                <input type="text" placeholder="Ask anything" />
                <div class="bottom-bar">
                    <div class="left">
                        <span class="plus">+</span>
                        <span>Add repositories, files, and spaces</span>
                    </div>

                    <div class="right">
                        <select class="model-select">
                            <option disabled>Model</option>
                            <optgroup disabled>Fast and cost-efficient</optgroup>
                            <option>GPT-5 mini</option>
                            <option>Grok Code Fast 1</option>

                            <option disabled>Versatile and highly intelligent</option>

                            <option>Claude Haiku 4.5</option>
                            <option>GPT-4.1</option>
                            <option>GPT-4o</option>
                            <option>GPT-5</option>
                            <option>Claude Sonnet 4</option>
                            <option>Claude Sonnet 5</option>

                            <option disabled>Most powerful at complex tasks</option>

                            <option>Claude Opus 4.1</option>
                            <option>Gemini 2.5 Pro</option>

                        </select>

                    </div>
                </div>
            </div>
            
        </div>
        <!-- in update -->
</body>

</html>
